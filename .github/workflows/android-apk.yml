name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main, aakash1454-dev ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"

      # Optional caches (you can comment these out if you want a fully "clean" run)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Flutter clean
        working-directory: mobile
        run: flutter clean

      # Force compile/target/min for all subprojects via local.properties (AGP 8 uses this in Flutter plugin)
      - name: Set SDK levels in local.properties
        working-directory: mobile/android
        run: |
          sed -i '/^flutter.compileSdkVersion/d' local.properties || true
          sed -i '/^flutter.targetSdkVersion/d'  local.properties || true
          sed -i '/^flutter.minSdkVersion/d'     local.properties || true
          echo "flutter.compileSdkVersion=35" >> local.properties
          echo "flutter.targetSdkVersion=35"  >> local.properties
          echo "flutter.minSdkVersion=21"     >> local.properties
          echo "local.properties ----"
          cat local.properties

      - name: Get packages
        working-directory: mobile
        run: flutter pub get

      # If you must stay on 3.x, uncomment this patch block instead of the upgrade above.
      # - name: Patch isar_flutter_libs manifest (AGP 8 fix)
      #   run: |
      #     MF="$HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-3.1.0+1/android/src/main/AndroidManifest.xml"
      #     if [ -f "$MF" ]; then
      #       sed -i 's/package="dev.isar.isar_flutter_libs"//g' "$MF"
      #       echo "Patched $MF (removed package attr)"
      #     fi

      - name: Restore keystore (robust decode)
  env:
    B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  run: |
    python - <<'PY'
    import os, base64, sys
    b64 = os.environ['B64']
    # tolerate accidental whitespace/newlines
    b64 = "".join(b64.split())
    out = os.path.expanduser('~/ishi_upload.jks')
    with open(out, 'wb') as f:
      f.write(base64.b64decode(b64))
    print("Wrote", out, "size=", os.path.getsize(out))
    PY

    cat > mobile/android/key.properties <<EOF
    storeFile=$HOME/ishi_upload.jks
    storePassword=${STORE_PASS}
    keyAlias=${ALIAS}
    keyPassword=${KEY_PASS}
    EOF

      - name: Verify keystore (hash + keytool)
  env:
    STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  run: |
    ls -lh $HOME/ishi_upload.jks
    sha256sum $HOME/ishi_upload.jks
    keytool -list \
      -keystore $HOME/ishi_upload.jks \
      -alias "${ALIAS}" \
      -storepass "${STORE_PASS}" \
      -keypass "${KEY_PASS}"


      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      # Install platforms: 35 (your compileSdk) AND 31 (covers libs that reference lStar)
      - name: Install Android platforms & build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platforms;android-31"

      - name: Install Android NDK 27
        run: sdkmanager "ndk;27.0.12077973"

      - name: Generate launcher icons
        working-directory: mobile
        run: flutter pub run flutter_launcher_icons

      - name: Generate native splash
        working-directory: mobile
        run: flutter pub run flutter_native_splash:create

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://ishi-api.onrender.com \
            --dart-define=MIN_APP_VERSION=1.0.0 \
            --dart-define=APP_STORE_URL=https://ironstronginitiative.com/app

      - name: Upload APK artifact (overwrite)
        uses: actions/upload-artifact@v4
        with:
          name: app-release           # same name each run
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          overwrite: true             # <---- overwrite instead of piling up
          retention-days: 14          # optional: keep for 14 days

